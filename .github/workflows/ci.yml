name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint and Test (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
          github-token: ""
          args: --config .golangci.yml --timeout 5m ./...
      - run: go mod verify
      - run: go vet ./...
      - run: go test -count=1 -race -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: echo '```' >> "$GITHUB_STEP_SUMMARY" && go tool cover -func=coverage.out >> "$GITHUB_STEP_SUMMARY" && echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce project coverage
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ { print $3 }')"
          if [[ "$total" != "100.0%" ]]; then
            echo "project coverage is $total, want 100.0%" >&2
            exit 1
          fi
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: >-
          ${{ success()
              && matrix.go == '1.27.x'
              && (github.event_name == 'push'
                  || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          version: v11.3.2
          fail_ci_if_error: true

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          cache: true
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        env:
          GOTOOLCHAIN: local

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          cache: true
      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

  ci-success:
    name: CI success
    if: always()
    needs: [ci, govulncheck, actionlint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check required CI jobs
        run: |
          if [[ "${{ needs.ci.result }}" != "success" || "${{ needs.govulncheck.result }}" != "success" || "${{ needs.actionlint.result }}" != "success" ]]; then
            echo "required CI jobs did not succeed" >&2
            exit 1
          fi
