name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --config .golangci.yml --timeout 5m ./...
      - run: go mod verify
      - run: go vet ./...
      - run: go test -count=1 -race -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: echo '```' >> "$GITHUB_STEP_SUMMARY" && go tool cover -func=coverage.out >> "$GITHUB_STEP_SUMMARY" && echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - id: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...

  tip:
    name: Test (Go tip)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Build Go tip
        run: |
          git clone --depth=1 https://go.googlesource.com/go "$RUNNER_TEMP/gotip"
          cd "$RUNNER_TEMP/gotip/src"
          ./make.bash
          echo "GOROOT=$RUNNER_TEMP/gotip" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/gotip/bin" >> "$GITHUB_PATH"
      - run: go version
      - run: go test -count=1 -race ./...
