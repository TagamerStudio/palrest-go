name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.14"
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          github-token: ""
          args: --config .golangci.yml --timeout 5m ./...
      - run: go mod verify
      - run: go vet ./...
      - run: go test -count=1 -race -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: echo '```' >> "$GITHUB_STEP_SUMMARY" && go tool cover -func=coverage.out >> "$GITHUB_STEP_SUMMARY" && echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        if: github.event_name == 'push'
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          version: v11.3.1

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.14"
          cache: true
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
        env:
          GOTOOLCHAIN: local

  tip:
    name: Test (Go tip)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.14"
          cache: true
      - name: Build Go tip
        run: |
          git init "$RUNNER_TEMP/gotip"
          git -C "$RUNNER_TEMP/gotip" remote add origin https://go.googlesource.com/go
          git -C "$RUNNER_TEMP/gotip" fetch --depth=1 origin e5da70bf014ddd13e359eb2226eed3d951e9a172
          git -C "$RUNNER_TEMP/gotip" checkout --detach FETCH_HEAD
          cd "$RUNNER_TEMP/gotip/src"
          ./make.bash
          echo "GOROOT=$RUNNER_TEMP/gotip" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/gotip/bin" >> "$GITHUB_PATH"
      - run: go version
      - run: go test -count=1 -race ./...
