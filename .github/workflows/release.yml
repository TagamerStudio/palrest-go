name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Validate tag and changelog
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "release workflow must run from a tag" >&2
            exit 1
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "tag must be a stable semantic version in the form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "tag does not resolve to the workflow commit" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "tag commit is not contained in main" >&2
            exit 1
          fi
          changelog_version="${GITHUB_REF_NAME#v}"
          changelog_pattern="${changelog_version//./\\.}"
          if ! grep -Eq "^## \[$changelog_pattern\]( |$)" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
          github-token: ""
          args: --config .golangci.yml --timeout 5m ./...
      - run: go mod verify
      - run: go vet ./...
      - run: go test -count=1 -race ./...
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        env:
          GOTOOLCHAIN: local

  release:
    name: Publish GitHub release
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag and CI status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag_sha="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "tag no longer points to the workflow commit" >&2
            exit 1
          fi
          ci_success="$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "CI success" and .conclusion == "success")] | length')"
          if [[ "$ci_success" == "0" ]]; then
            echo "CI success check is missing or not successful for $GITHUB_SHA" >&2
            exit 1
          fi
      - name: Extract release notes
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "empty release notes for $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file release-notes.md
